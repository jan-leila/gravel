name: Build

on: [push]

# The job only builds and asserts; nothing here writes to the repository, so
# the workflow token gets read access and no more. actions/checkout persists
# the token in the checkout by default, which is why the scope matters even
# though no step names it.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    # The tree carries no jvmToolchain pin (see DESIGN_NOTES.md, F-Droid), so
    # the JDK that launches Gradle is the one that compiles. 21 is F-Droid's
    # buildserver JDK; 17 is the documented floor ("any JDK 17 or newer") and
    # the bytecode target. Building on both keeps the floor a tested claim: a
    # dependency or catalog bump that quietly needs 21 fails the 17 leg
    # instead of only failing whoever still builds on 17 by hand.
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history with tags: the version-file checks look at the tags
          # pointing at the built commit.
          fetch-depth: 0
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-deps-${{ runner.os }}-
      # assembleRelease on a checkout with no keystore is the F-Droid shape:
      # release packages unsigned, and the packaging-time APK checks in
      # androidApp/build.gradle.kts run against both variants. The device-test
      # source sets are compiled here and run nowhere in CI.
      - name: Build and Test
        run: >-
          ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease
          testDebugUnitTest testAndroidHostTest jvmTest lintDebug
          :androidApp:assembleDebugAndroidTest :socketfilter:assembleDebugAndroidTest
          :libpebble3:compileAndroidDeviceTest
          :routers:slack:assembleRelease :routers:homeassistant:assembleRelease :routers:vikunja:assembleRelease
          :routers:mastodon:assembleRelease :routers:osmnote:assembleRelease :routers:signal:assembleRelease
          :routers:actual:assembleRelease :routers:email:assembleRelease
      # androidApp/version.properties declares both numbers, and on a tag build
      # the versionName must also be the tag. The Gradle-time
      # VerifyReleaseVersionFile task and FdroidGuardrailsTest check the same
      # from inside the build; this step checks it against the artifact.
      - name: Check the built version against the version file
        run: |
          code="$(sed -n 's/^versionCode=\([0-9][0-9]*\)$/\1/p' androidApp/version.properties)"
          name="$(sed -n 's/^versionName=\([0-9][0-9.]*\)$/\1/p' androidApp/version.properties)"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          badging="$("$aapt2" dump badging androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk | head -n 1)"
          echo "version file: versionCode=$code versionName=$name"
          echo "built:        $badging"
          test -n "$code" && test -n "$name"
          test "$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")" = "$code"
          test "$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")" = "$name"
          if [ "$REF_TYPE" = tag ] && printf '%s' "$REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            test "$REF_NAME" = "$name"
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
      # The built manifest is what store scanners read. The source-level pin
      # is NetworkSecurityConfigTest; this catches a library manifest merging
      # usesCleartextTraffic back into the APK, which the source test cannot see.
      - name: Check the built manifest keeps cleartext off
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          manifest="$("$aapt2" dump xmltree --file AndroidManifest.xml androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk)"
          if printf '%s' "$manifest" | grep -q 'usesCleartextTraffic'; then
            echo "built manifest declares usesCleartextTraffic:"; printf '%s' "$manifest" | grep 'usesCleartextTraffic'; exit 1
          fi
          printf '%s' "$manifest" | grep -q 'networkSecurityConfig' || { echo "built manifest declares no networkSecurityConfig"; exit 1; }
          echo "built manifest: no usesCleartextTraffic, networkSecurityConfig declared"
      # The two F-Droid listings build from one tag; -Pgravel.unsigned=true is the unsigned recipe's
      # gradleprops. Last, because it replaces the release APK the steps above read. One JDK
      # leg is enough: the property changes identity and one flag, not the toolchain.
      - name: Build the unsigned listing and check both identities
        if: matrix.java-version == 21
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          apk=androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          identity() { "$aapt2" dump badging "$apk" | sed -n -e "s/^package: name='\([^']*\)'.*/\1/p" -e "s/^application-label:'\(.*\)'$/\1/p" | paste -sd '|'; }
          signed="$(identity)"
          echo "default build: $signed"
          test "$signed" = "com.anopticlabs.gravel.signed|Gravel"
          ./gradlew :androidApp:assembleRelease :androidApp:testDebugUnitTest --tests com.anopticlabs.gravel.UnsignedListingTest -Pgravel.unsigned=true
          unsigned="$(identity)"
          echo "unsigned build: $unsigned"
          test "$unsigned" = "com.anopticlabs.gravel|Gravel (unsigned)"
