name: Release

# Publishes a release from the `release` branch. Every push to it reads the version that
# androidApp/version.properties declares; if that version already has a published GitHub release
# the run stops there, so merging to release without bumping the file publishes nothing.
# Otherwise it builds the pushed commit, signs it, and creates the GitHub release, which creates
# the tag (the versionName) on that commit. Tags are never pushed by hand.
#
# The tag is created with the workflow token, and GitHub starts no workflow for a ref that token
# creates, so Build does not run on it; the checks below are the tag's CI.
#
# The GitHub release is what Obtainium installs from and what F-Droid's "Gravel" listing
# (com.anopticlabs.gravel.signed) names as its Binaries: F-Droid finds the new tag, builds it
# itself, copies this APK's signature onto its own unsigned build, and ships this APK only if the
# result verifies, i.e. only if the two builds are byte-identical outside the signature. The
# unsigned listing (-Pgravel.unsigned=true) is F-Droid's alone and is not built here.
#
# The eight router apps (routers/README.md) are built in the same run, signed with the same key and
# attached to the same release, each under its own application id (com.jan_leila.apps.<name>).
# Obtainium follows each by an APK filter on its file name, gravel-router-<name>-<version>.apk.
# F-Droid does not build them.
#
# The APK is built unsigned, exactly as F-Droid builds it (no keystore.jks in the checkout), and
# signed afterwards with apksigner, so the signing
# step adds the APK Signing Block and changes nothing else. See DESIGN_NOTES.md, F-Droid.
#
# Secrets: GRAVEL_KEYSTORE_BASE64 (the release keystore, base64), GRAVEL_KEYSTORE_PASSWORD,
# GRAVEL_KEY_ALIAS, GRAVEL_KEY_PASSWORD. Variable: GRAVEL_SIGNER_SHA256, the signing
# certificate's SHA-256 (lowercase hex, no colons), the same value as the recipe's
# AllowedAPKSigningKeys; a release signed with any other key stops before publishing.

on:
  push:
    branches:
      - release

permissions:
  contents: write

# Two pushes in quick succession must not both publish one version: the second waits, then finds
# the first's release and stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # The token has contents: write and the build and tools below run third-party code, so
          # it is not left in .git/config; the gh steps pass it as GH_TOKEN themselves.
          persist-credentials: false
          submodules: recursive
          # All branches and tags, for the main and version checks below.
          fetch-depth: 0
      - name: Read the declared version and skip a released one
        id: version
        run: |
          code="$(sed -n 's/^versionCode=\([0-9][0-9]*\)$/\1/p' androidApp/version.properties)"
          name="$(sed -n 's/^versionName=\([0-9][0-9.]*\)$/\1/p' androidApp/version.properties)"
          echo "version file: versionCode=$code versionName=$name"
          test -n "$code"
          printf '%s' "$name" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if gh release view "$name" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$name is already released; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag without a release (created outside this workflow) is reused only if it already
          # marks this commit; anywhere else the version is taken.
          if tagged="$(git rev-parse -q --verify "refs/tags/$name^{commit}")" && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $name already exists on $tagged, not on $GITHUB_SHA; bump versionName"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Only reviewed code is released: the pushed tree must be exactly the tree of a commit on
      # main. Holds however the PR into release was merged (merge commit, squash, rebase) and
      # rules out content that exists only on release, conflict resolutions included.
      - name: Check the released tree is on main
        if: steps.version.outputs.publish == 'true'
        run: |
          tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          if ! git log --format=%T refs/remotes/origin/main | grep -qxF "$tree"; then
            echo "the tree of $GITHUB_SHA matches no commit on main; merge main into release unchanged"
            exit 1
          fi
      # F-Droid offers an update only for a higher versionCode, and Obtainium compares
      # versionNames, so both must go up against the newest other release tag.
      - name: Check the number goes up
        if: steps.version.outputs.publish == 'true'
        run: |
          previous="$(git tag --list | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | grep -vxF "$NAME" | sort -V | tail -n 1)"
          echo "newest other release tag: ${previous:-none}"
          if [ -n "$previous" ]; then
            test "$(printf '%s\n%s\n' "$previous" "$NAME" | sort -V | tail -n 1)" = "$NAME" && test "$previous" != "$NAME"
            before="$(git show "$previous:androidApp/version.properties" | sed -n 's/^versionCode=\([0-9][0-9]*\)$/\1/p')"
            echo "versionCode at $previous: $before"
            test "$CODE" -gt "$before"
          fi
          test -f "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
      # 21 is the JDK F-Droid's buildserver builds with.
      - name: Setup JDK
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      # The router apps (routers/README.md) ship with every release under the same version and
      # key; their lint and tests run here because no other workflow builds them.
      - name: Lint and test the router apps
        if: steps.version.outputs.publish == 'true'
        run: >-
          ./gradlew --no-daemon --stacktrace :routers:common:lintDebug :routers:common:testDebugUnitTest
          $(for a in slack homeassistant vikunja mastodon osmnote signal actual email; do printf ":routers:$a:lintDebug :routers:$a:testDebugUnitTest "; done)
      # No dependency cache: a release builds from a clean Gradle home, as F-Droid does. The build
      # stamps both numbers from version.properties; nothing in it depends on the tag, so this
      # untagged build and F-Droid's build of the tag produce the same APK.
      - name: Build the unsigned release APKs
        if: steps.version.outputs.publish == 'true'
        run: >-
          ./gradlew --no-daemon --stacktrace :androidApp:assembleRelease
          $(for a in slack homeassistant vikunja mastodon osmnote signal actual email; do printf ":routers:$a:assembleRelease "; done)
      - name: Check the built APK against the release number
        if: steps.version.outputs.publish == 'true'
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          badging="$("$aapt2" dump badging androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk | head -n 1)"
          echo "$badging"
          test "$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")" = "$NAME"
          test "$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")" = "$CODE"
          test "$(printf '%s' "$badging" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")" = "com.anopticlabs.gravel.signed"
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
      - name: Check the router APKs against the release number
        if: steps.version.outputs.publish == 'true'
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          for a in slack homeassistant vikunja mastodon osmnote signal actual email; do
            badging="$("$aapt2" dump badging "routers/$a/build/outputs/apk/release/$a-release-unsigned.apk" | head -n 1)"
            echo "$badging"
            test "$(printf '%s' "$badging" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")" = "com.jan_leila.apps.$a"
            test "$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")" = "$NAME"
            test "$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")" = "$CODE"
          done
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
      - name: Sign the APK
        if: steps.version.outputs.publish == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          printf '%s' "$GRAVEL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/out"
          # --alignment-preserved: apksigner otherwise re-aligns entries to its own defaults,
          # which would change bytes F-Droid's build does not change.
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$GRAVEL_KEY_ALIAS" \
            --ks-pass env:GRAVEL_KEYSTORE_PASSWORD --key-pass env:GRAVEL_KEY_PASSWORD \
            --alignment-preserved true \
            --out "$RUNNER_TEMP/out/gravel-$NAME.apk" \
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          # The router apps are signed with the same key: Gravel trusts a router by certificate, and a
          # Gravel and router pair on one key is accepted without either app listing the other.
          for a in slack homeassistant vikunja mastodon osmnote signal actual email; do
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$GRAVEL_KEY_ALIAS" \
              --ks-pass env:GRAVEL_KEYSTORE_PASSWORD --key-pass env:GRAVEL_KEY_PASSWORD \
              --out "$RUNNER_TEMP/out/gravel-router-$a-$NAME.apk" \
              "routers/$a/build/outputs/apk/release/$a-release-unsigned.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"
        env:
          NAME: ${{ steps.version.outputs.name }}
          GRAVEL_KEYSTORE_BASE64: ${{ secrets.GRAVEL_KEYSTORE_BASE64 }}
          GRAVEL_KEYSTORE_PASSWORD: ${{ secrets.GRAVEL_KEYSTORE_PASSWORD }}
          GRAVEL_KEY_ALIAS: ${{ secrets.GRAVEL_KEY_ALIAS }}
          GRAVEL_KEY_PASSWORD: ${{ secrets.GRAVEL_KEY_PASSWORD }}
      - name: Check the signer
        if: steps.version.outputs.publish == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certs="$(for apk in "$RUNNER_TEMP"/out/*.apk; do "$apksigner" verify --print-certs "$apk"; done)"
          printf '%s\n' "$certs"
          # One line per signature scheme, labelled "Signer #1" or "V3.0 Signer" by apksigner
          # version; every scheme of every APK (Gravel and the router apps) must carry the same
          # single certificate.
          digest="$(printf '%s\n' "$certs" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | sort -u)"
          test "$(printf '%s\n' "$digest" | grep -c .)" = 1
          test -n "$GRAVEL_SIGNER_SHA256" && test "$digest" = "$GRAVEL_SIGNER_SHA256"
        env:
          NAME: ${{ steps.version.outputs.name }}
          GRAVEL_SIGNER_SHA256: ${{ vars.GRAVEL_SIGNER_SHA256 }}
      # The check F-Droid makes against its own build: copy the signature onto the unsigned APK
      # and verify. Here it proves signing changed nothing but the signing block.
      - name: Check the signature copies onto the unsigned APK
        if: steps.version.outputs.publish == 'true'
        run: |
          # Installed from PyPI only if each wheel matches its pinned hash (click is apksigcopier's
          # one dependency); a re-pin takes the sha256 from the wheel's PyPI file listing.
          printf '%s\n' \
            'apksigcopier==1.1.1 --hash=sha256:0834bb7d6f3607bb0994cf8cd2e26b8f0c9d481e13b75872e0fa9cec052e519b' \
            'click==8.5.0 --hash=sha256:255bc9599cf7748b4b1a446ccc735421bd08a2ae529a8b88597d3de5664ee360' \
            > "$RUNNER_TEMP/apksigcopier.txt"
          python3 -m venv "$RUNNER_TEMP/apksigcopier"
          "$RUNNER_TEMP/apksigcopier/bin/pip" install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/apksigcopier.txt"
          PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1):$PATH"
          "$RUNNER_TEMP/apksigcopier/bin/apksigcopier" compare --unsigned \
            "$RUNNER_TEMP/out/gravel-$NAME.apk" \
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
        env:
          NAME: ${{ steps.version.outputs.name }}
      # Creates the tag on the built commit (or reuses one already there, which the first step
      # allows only on this commit). Last, so a failed check leaves neither tag nor release.
      - name: Publish the GitHub release and tag
        if: steps.version.outputs.publish == 'true'
        run: |
          cd "$RUNNER_TEMP/out"
          sha256sum gravel-*.apk > "gravel-$NAME.apk.sha256"
          {
            cat "$GITHUB_WORKSPACE/fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            printf '\nSigning certificate SHA-256: `%s`\n' "$GRAVEL_SIGNER_SHA256"
          } > notes.md
          gh release create "$NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Gravel $NAME" --notes-file notes.md \
            gravel-*.apk "gravel-$NAME.apk.sha256"
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          GH_TOKEN: ${{ github.token }}
          GRAVEL_SIGNER_SHA256: ${{ vars.GRAVEL_SIGNER_SHA256 }}
